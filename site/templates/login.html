{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center"
     style="min-height: 80vh;">

    <div class="card border-0 shadow" style="width: 400px;">

        <!-- Cabeçalho -->
        <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0">🔐 Área Administrativa</h5>
        </div>

        <div class="card-body p-4">

            <!-- Mensagens de erro -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} py-2">
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Formulário -->
            <form method="POST" action="{{ url_for('login') }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuário</label>
                    <input type="text"
                           name="username"
                           class="form-control form-control-lg"
                           placeholder="admin"
                           required
                           autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Senha</label>
                    <input type="password"
                           name="password"
                           class="form-control form-control-lg"
                           placeholder="••••••••"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-dark btn-lg">
                        Entrar
                    </button>
                </div>

            </form>

        </div>

        <!-- Rodapé -->
        <div class="card-footer text-center py-3 bg-light">
            <a href="{{ url_for('powerbi_dashboard') }}"
               class="text-muted small text-decoration-none">
                ← Voltar ao Dashboard
            </a>
        </div>

    </div>
</div>
{% endblock %}
