{% extends "base.html" %}

{% block content %}
<div class="content-wrapper">
    <div class="container-fluid py-4">

        <!-- Cabeçalho -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">⚙️ Painel Administrativo</h4>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-sm">
                🚪 Sair
            </a>
        </div>

        <!-- Card Pipeline -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-light">
                <h5 class="mb-0">🚀 Pipeline de Dados</h5>
            </div>
            <div class="card-body">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <span class="fw-semibold">Status:</span>
                    <span id="pipeline-status" class="badge bg-secondary fs-6">
                        Verificando...
                    </span>
                </div>
                <button id="btn-pipeline"
                        class="btn btn-dark"
                        onclick="executarPipeline()">
                    ▶ Executar Pipeline
                </button>
            </div>
        </div>

        <!-- Card Logs -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <h5 class="mb-0">📋 Logs do Sistema</h5>
                <button class="btn btn-outline-danger btn-sm"
                        onclick="limparLogs()">
                    🗑 Limpar
                </button>
            </div>
            <div class="card-body p-0">
                <div id="logs-container"
                     style="height: 450px;
                            overflow-y: auto;
                            background: #1e1e1e;
                            color: #d4d4d4;
                            font-family: 'Courier New', monospace;
                            font-size: 13px;
                            padding: 16px;
                            border-radius: 0 0 8px 8px;">
                    <span style="color:#888;">Carregando logs...</span>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {

    atualizarTudo();
    setInterval(atualizarTudo, 5000);

    function atualizarTudo() {
        atualizarStatus();
        atualizarLogs();
    }

    // ── Status da pipeline ────────────────────────────────
    function atualizarStatus() {
        fetch('/powerbi/admin/pipeline-status')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var badge = document.getElementById('pipeline-status');
                var btn   = document.getElementById('btn-pipeline');

                if (data.running) {
                    badge.className   = 'badge bg-warning text-dark fs-6';
                    badge.textContent = '⏳ ' + data.status;
                    btn.disabled      = true;
                    btn.textContent   = '⏳ Executando...';
                } else {
                    btn.disabled    = false;
                    btn.textContent = '▶ Executar Pipeline';

                    if (data.status === 'completed') {
                        badge.className   = 'badge bg-success fs-6';
                        badge.textContent = '✅ Concluída';
                    } else if (data.status && data.status.startsWith('error')) {
                        badge.className   = 'badge bg-danger fs-6';
                        badge.textContent = '❌ Erro';
                    } else {
                        badge.className   = 'badge bg-secondary fs-6';
                        badge.textContent = '⏸ ' + (data.status || 'idle');
                    }
                }
            })
            .catch(function(e) { console.error('Erro status:', e); });
    }

    // ── Logs ──────────────────────────────────────────────
    function atualizarLogs() {
        fetch('/powerbi/admin/logs')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var container = document.getElementById('logs-container');

                if (!data.logs || data.logs.length === 0) {
                    container.innerHTML =
                        '<span style="color:#888;">Nenhum log registrado.</span>';
                    return;
                }

                container.innerHTML = data.logs.map(function(log) {
                    var cor = '#d4d4d4';
                    if (log.includes('❌') || log.includes('Erro')) cor = '#f48771';
                    if (log.includes('✅'))                          cor = '#89d185';
                    if (log.includes('⚠️'))                         cor = '#dcdcaa';
                    if (log.includes('🚀'))                          cor = '#9cdcfe';
                    return '<div style="color:' + cor + ';margin-bottom:3px;">'
                         + escapeHtml(log) + '</div>';
                }).join('');

                container.scrollTop = container.scrollHeight;
            })
            .catch(function(e) { console.error('Erro logs:', e); });
    }

    // ── Executar pipeline ─────────────────────────────────
    window.executarPipeline = function() {
        if (!confirm('Deseja executar a pipeline agora?')) return;

        fetch('/powerbi/admin/run-pipeline', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                alert(data.message || 'Pipeline iniciada!');
                atualizarTudo();
            })
            .catch(function(e) { alert('Erro: ' + e.message); });
    };

    // ── Limpar logs ───────────────────────────────────────
    window.limparLogs = function() {
        if (!confirm('Limpar todos os logs?')) return;

        fetch('/powerbi/admin/logs', { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function() { atualizarLogs(); })
            .catch(function(e) { alert('Erro: ' + e.message); });
    };

    // ── Escape HTML ───────────────────────────────────────
    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

})();
</script>
{% endblock %}
